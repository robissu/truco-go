services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: truco
      POSTGRES_PASSWORD: truco
      POSTGRES_DB: truco
    ports:
      - "5432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truco -d truco"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://truco:truco@db:5432/truco
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: